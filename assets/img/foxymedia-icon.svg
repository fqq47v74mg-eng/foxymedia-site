<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!--
    FoxyMedia — star-outline fox mark
    6-point star silhouette: 2 ears (top) + 2 wide flanks (sides) + chin (bottom)
    2 colours only: #FF5F00 orange + #0E0E1C dark
    No gradients. No cream. Flat.
  -->

  <!-- Inner ear accent (darker orange wedges) -->
  <polygon points="40,42 30,8 50,36" fill="#C44200"/>
  <polygon points="50,36 70,8 60,42" fill="#C44200"/>

  <!-- Main face: star silhouette -->
  <!-- Path: left-ear-base → left-ear-tip → right-ear-tip → right-ear-base
             → right-flank-tip → right-jaw → chin-tip → left-jaw → left-flank-tip → close -->
  <path d="
    M40,42
    L30,8
    L50,36
    L70,8
    L60,42
    L94,52
    L74,65
    L78,86
    L50,98
    L22,86
    L26,65
    L6,52
    Z
  " fill="#FF5F00"/>

  <!-- Left eye: sharp slash -->
  <polygon points="22,60 36,52 40,64 26,70" fill="#0E0E1C"/>

  <!-- Right eye: sharp slash (mirrored) -->
  <polygon points="64,52 78,60 74,70 60,64" fill="#0E0E1C"/>

  <!-- Nose -->
  <polygon points="46,89 50,97 54,89" fill="#0E0E1C"/>
</svg>
