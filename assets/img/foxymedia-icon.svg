<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    FoxyMedia — star-fox mark v3
    Based on the geometric flat fox OC selected.
    Single flat orange #FF5F00. Dark charcoal eyes/nose.
    No gradients. No cream. No inner ears.
    Star-silhouette: 2 ear points + 2 wide flanks + 1 chin point.
  -->

  <!-- Main star-fox silhouette -->
  <path d="
    M 40,40
    L 32,4
    L 50,26
    L 68,4
    L 60,40
    L 96,55
    L 78,72
    L 50,96
    L 22,72
    L 4,55
    Z
  " fill="#FF5F00"/>

  <!-- Left eye — narrow fierce slit, outer edge higher -->
  <polygon points="18,59 34,54 37,62 21,65" fill="#0E0E1C"/>

  <!-- Right eye — mirror -->
  <polygon points="63,54 79,59 79,65 63,62" fill="#0E0E1C"/>

  <!-- Nose — tiny dark point at chin -->
  <polygon points="46,87 50,95 54,87" fill="#0E0E1C"/>
</svg>
