<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    FoxyMedia — star-fox mark v4
    Warm cream side flanks (the "star points")
    Orange central face + pointed ears + chin
    Darker inner ear accents
    Fierce narrow angled dark eyes + nose
  -->

  <!-- Cream side flanks — horizontal star points -->
  <polygon points="33,47 2,54 35,73" fill="#FFE2C0"/>
  <polygon points="67,47 65,73 98,54" fill="#FFE2C0"/>

  <!-- Main orange body: face + ears + pointed chin -->
  <path d="M33,47 L28,5 L50,27 L72,5 L67,47 L65,73 L50,97 L35,73 Z"
        fill="#FF5F00"/>

  <!-- Inner ear accents (deeper orange) -->
  <polygon points="36,44 30,11 48,40" fill="#C44200"/>
  <polygon points="52,40 70,11 64,44" fill="#C44200"/>

  <!-- Left eye — narrow fierce angled slit -->
  <polygon points="35,58 49,53 51,61 37,64" fill="#0E0E1C"/>

  <!-- Right eye — mirror -->
  <polygon points="49,53 63,58 63,64 49,61" fill="#0E0E1C"/>

  <!-- Nose -->
  <polygon points="46,89 50,97 54,89" fill="#0E0E1C"/>
</svg>
